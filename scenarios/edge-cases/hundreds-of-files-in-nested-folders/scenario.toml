  { tool = "list_dir", arguments = { path = "cameras/camera-1" } },
  { tool = "list_dir", arguments = { path = "cameras/camera-1/2026-09-21" } },
  { tool = "read_file", arguments = { path = "cameras/camera-1/2026-09-21/IMG_12101.JPG" } },
]
