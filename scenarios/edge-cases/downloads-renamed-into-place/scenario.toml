description = "Browsers download into a temporary file and rename it to its final name. The temporary file is left out, so a download shows up only as the file it becomes, also when its .part file stays for longer than a debounce. A slow Firefox download comes first as the empty file that holds its name, then as changed once the .part file replaces it."

