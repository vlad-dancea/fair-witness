description = "A researcher saves the clinic's monthly export, a ZIP attachment, into the data folder, extracts it a few seconds later and deletes the archive. The export names the patients and their birth dates. The DMP is small."

[[set]]
changes = [{ created = "data/clinic-export-2026-10.zip" }]
contradicts = true
dmp_field = [
  "dataset[0].personal_data",
  "dataset[0].sensitive_data",
  "dataset[0].security_and_privacy",
  "ethical_issues_description",
]
explanation = "A model cannot look inside the archive, but the researcher has extracted it before its review starts, and the export next to it names the patients and their birth dates. The DMP says the clinic anonymises every record and the project holds no personal data."
fake_tool_calls = [
  { tool = "list_dir", arguments = { path = "data" } },
  { tool = "read_file", arguments = { path = "data/clinic-export-2026-10.csv" } },
]

[[set]]
changes = [{ created = "data/clinic-export-2026-10.csv" }]
contradicts = true
dmp_field = [
  "dataset[0].personal_data",
  "dataset[0].sensitive_data",
  "dataset[0].security_and_privacy",
  "ethical_issues_description",
]
explanation = "The export names the patients and their birth dates, but the DMP says the clinic anonymises every record and the project holds no personal data."
fake_tool_calls = [{ tool = "read_file", arguments = { path = "data/clinic-export-2026-10.csv" } }]

[[set]]
changes = [{ deleted = "data/clinic-export-2026-10.zip" }]
contradicts = false
explanation = "Deleting the archive after extracting it removes nothing the DMP plans."
