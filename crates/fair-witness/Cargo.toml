[package]
name = "fair-witness"
version = "0.1.0"
edition = "2024"
description = "Flags folder changes that contradict your DAMAP data management plan"
repository = "https://github.com/vlad-dancea/fair-witness"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
fair-witness-core = { path = "../fair-witness-core" }
futures = "0.3.34"
jiff = "0.2.37"
notify-rust = "4.18.1"
open = "5.4.4"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "sync", "time"] }
unicode-width = "0.2.2"
