[package]
name = "fair-witness"
version = "0.1.60"
edition = "2024"
description = "Flags folder changes that contradict your DAMAP data management plan"
repository = "https://github.com/vlad-dancea/fair-witness"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
fair-witness-core = { path = "../fair-witness-core" }
futures = "0.3.34"
jiff = "0.2.37"
notify-rust = "4.18.1"
open = "5.4.4"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-width = "0.2.2"

[dev-dependencies]
fair-witness-core = { path = "../fair-witness-core", features = ["testing"] }
insta = { version = "1.49.0", features = ["filters"] }
tempfile = "3.27.0"
