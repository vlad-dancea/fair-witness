[package]
name = "fair-witness-scenarios"
version = "0.1.0"
edition = "2024"
description = "Runs scripted researcher scenarios against headless fair-witness"
repository = "https://github.com/vlad-dancea/fair-witness"
publish = false

# A development tool, so dist leaves it out of releases.
[package.metadata.dist]
dist = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
fair-witness-core = { path = "../fair-witness-core", features = ["testing"] }
jiff = { version = "0.2.37", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt"] }
toml = "1.1.6"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3.18"
