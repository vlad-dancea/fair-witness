[package]
name = "fair-witness-core"
version = "0.1.0"
edition = "2024"
description = "Watches a research project folder and reviews its changes against a DAMAP data management plan"
repository = "https://github.com/vlad-dancea/fair-witness"

[dependencies]
anyhow = "1.0.104"
genai = "0.6.5"
ignore = "0.4.33"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt"] }
toml = "1.1.6"

[dev-dependencies]
tempfile = "3.27.0"
