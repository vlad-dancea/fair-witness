# Continuous integration and releases for fair-witness.
#
# Runs the `check` task developers run before pushing: rustfmt, clippy with every warning as an
# error, and the tests. mise installs the Rust toolchain pinned in mise.toml, so CI builds with
# exactly the toolchain used locally. On main, a passing check publishes the next release.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Only the newest commit of a pull request matters, so a new push cancels the run before it.
# Runs on main finish, so that every commit on main is released.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: jobs only read the repository, unless they ask for more.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    # A hung build fails after 20 minutes instead of GitHub's 6-hour default.
    timeout-minutes: 20
    steps:
      # Actions are pinned to a full commit SHA: a tag can be moved to different code, a
      # commit cannot. The trailing comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step pushes, so the token is not left behind in .git/config.
          persist-credentials: false

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

      # Caches the dependencies' build output between runs. Releases are built by
      # release.yml, which does not use this cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - run: mise run check

  # Decides whether main differs from the latest release in what gets built: the sources, the
  # dependencies or how dist builds them. Changes to CI, the README or mise.toml alone are
  # checked but not released, because the binaries would be the same.
  #
  # The latest release is the newest tag whose release is published or still building. Comparing
  # with it rather than the previous push also releases code from a push whose run was cancelled
  # while pending or whose check failed. Counting a release that is still building means a push
  # that reverts it is released after it, and skipping a tag whose release failed means its code
  # goes out with the next push.
  changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # see whether a tag's release is still building
    outputs:
      release: ${{ steps.paths.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: paths
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=
          for tag in $(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname); do
            if gh release view "$tag" >/dev/null 2>&1; then
              base=$tag
              break
            fi
            if ! run=$(gh run list --workflow release.yml --branch "$tag" --limit 1 --json status --jq '.[0].status // ""'); then
              echo "::warning::could not read the release run for $tag, releasing anyway"
              echo "release=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ -n "$run" ] && [ "$run" != completed ]; then
              base=$tag
              break
            fi
            echo "$tag was not released, comparing with an older tag."
          done
          if [ -z "$base" ]; then
            echo "::warning::no published or building release found, releasing anyway"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A release tag points at a commit that only bumps the version, on top of the main
          # commit the release was built from.
          if git diff --quiet "$base^" "$GITHUB_SHA" -- 'fair-witness' 'Cargo.toml' 'Cargo.lock' 'dist-workspace.toml' '.github/workflows/release.yml'; then
            echo "Nothing that goes into the release changed since $base, so there is no new release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            status=$?
            # A diff error releases, as every push did before.
            if [ "$status" -ne 1 ]; then echo "::warning::git diff failed with $status, releasing anyway"; fi
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  # Picks the next version (the version in fair-witness/Cargo.toml, or the patch after the
  # latest tag if that is already released), commits the bump on a detached release commit,
  # tags it and starts release.yml on that tag. main itself is never written to.
  publish:
    needs: [check, changes]
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # push the release tag
      actions: write # start release.yml
    steps:
      # Keeps the token in .git/config, because this job pushes the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Pick the next version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          manifest=fair-witness/Cargo.toml
          current=$(sed -n 's/^version = "\(.*\)"$/\1/p' "$manifest" | head -1)
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          latest=${latest#v}
          if [ -z "$latest" ] || [ "$(printf '%s\n%s\n' "$latest" "$current" | sort -V | tail -1)" != "$latest" ]; then
            next=$current
          else
            IFS=. read -r major minor patch <<<"${latest%%-*}"
            next="$major.$minor.$((patch + 1))"
          fi
          echo "Releasing $next (Cargo.toml: $current, latest tag: ${latest:-none})"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Tag a release commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          sed -i "0,/^version = \".*\"$/s//version = \"$VERSION\"/" fair-witness/Cargo.toml
          # Keep Cargo.lock in step with the new version.
          sed -i "/^name = \"fair-witness\"$/{n;s/^version = \".*\"$/version = \"$VERSION\"/}" Cargo.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -am "Release v$VERSION"
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Start the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh workflow run release.yml --ref "v$VERSION" -f tag="v$VERSION"
